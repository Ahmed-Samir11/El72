[tool.black]
line-length = 88
skip-string-normalization = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "B"]
ignore = ["E203"]

# FastAPI: `Depends(...)`/`Query(...)`/`Path(...)` in route argument defaults is the
# idiomatic dependency-injection pattern, not a mutable-default bug (B008).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# Existing backend functions peak at cyclomatic 17; gate at 20 so the check is green
# without rewriting critical logic. New code should target lower.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.isort]
profile = "black"
