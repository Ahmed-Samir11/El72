services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq_ts
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    depends_on:
      - redis
      - timescaledb
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8001:8000"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8000:8000"

  notifier:
    build:
      context: ./services/notification
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
      MOCK_WHATSAPP: "true"
    command: ["npm", "run", "start"]

