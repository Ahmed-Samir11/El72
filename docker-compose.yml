services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq_ts
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    depends_on:
      - redis
      - timescaledb
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8001:8000"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8000:8000"

  notifier:
    build:
      context: ./services/notification
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
      MOCK_WHATSAPP: "true"
    command: ["npm", "run", "start"]

  scraper-monitor:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile.monitor
    depends_on:
      - redis
      - postgres
      - timescaledb
    environment:
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      REDIS_URL: "redis://redis:6379"
      SCRAPE_INTERVAL: "30"
      MAX_CONCURRENT_SCRAPES: "10"
      BROWSER_POOL_SIZE: "5"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "scraper_tasks"
  
  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      REDIS_URL: "redis://redis:6379"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "scraper_tasks"
      STREAM_CONFIRMED_DEALS: "stream:confirmed_deals"
      BROWSER_POOL_SIZE: "2"
      SCRAPER_NAV_TIMEOUT_MS: "60000"
    command: ["python", "-m", "services.scraper.scraper"]
  
  whatsapp:
    build:
      context: ./services/whatsapp
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      STREAM_NAME: "stream:confirmed_deals"
      CONSUMER_GROUP: "cg_whatsapp"
      CONSUMER_NAME: "whatsapp-1"
      WHATSAPP_ACCESS_TOKEN: "EAAMDRapIJBIBQEQ480Xcq7GVlEfcVSGd1fM2Brb3aDLLgxsBpuz6n4oyZCyIsCQ2wHI3yHyqsKOs2fCZC245pYDcBetPKhYSFhlgZAp0a1rFA8SoKyeet8Jyoj5yxk00HKM2YJ4sn9oOLudY6QWyy5c5rYLIQKjpE8npHLNrSPmYcgLZAOZBfxTV01jC442bVOaVtXxS5gmHl95KxPPsGTxsyv85esujiqsMjLVXA5Xc6OrvnAC4VsmRIYbu4JCOsxoszIZAbdygTYKQJt2MQx"
      WHATSAPP_PHONE_NUMBER_ID: "966490223206963"
      WHATSAPP_API_VERSION: "v18.0"
      MOCK_WHATSAPP: "false"
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  timescale-data:
