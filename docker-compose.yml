services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq_ts
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: elhaq
      POSTGRES_PASSWORD: elhaq_pass
      POSTGRES_DB: elhaq
    ports:
      # Host 5432 is often occupied by a local Postgres; use 5434 externally.
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    depends_on:
      - redis
      - timescaledb
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8001:8000"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
    ports:
      - "8000:8000"

  notifier:
    build:
      context: ./services/notification
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
      MOCK_WHATSAPP: "true"
    command: ["npm", "run", "start"]

  scraper-monitor:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile.monitor
    depends_on:
      - redis
      - postgres
      - timescaledb
    environment:
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      REDIS_URL: "redis://redis:6379"
      SCRAPE_INTERVAL: "30"
      MAX_CONCURRENT_SCRAPES: "10"
      BROWSER_POOL_SIZE: "5"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "stream:targets"
  
  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      REDIS_URL: "redis://redis:6379"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "stream:targets"
      STREAM_CONFIRMED_DEALS: "stream:confirmed_deals"
      BROWSER_POOL_SIZE: "2"
      SCRAPER_NAV_TIMEOUT_MS: "60000"
    command: ["python", "-m", "services.scraper.scraper"]
  
  whatsapp:
    build:
      context: ./services/whatsapp
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://elhaq:elhaq_pass@postgres:5432/elhaq"
      STREAM_NAME: "stream:confirmed_deals"
      CONSUMER_GROUP: "cg_whatsapp"
      CONSUMER_NAME: "whatsapp-1"
      WHATSAPP_ACCESS_TOKEN: "EAAMDRapIJBIBSJzUSLQpzUY2m9IYy2sYUZC4ykbUvBZAQLyZB9GUmfaRA22fNK3xqQIwHC2FOoRq1FlfZBGQaIeMk74IUKgwvchqqbKDsxPyZBMVNZA5ozCwfSmZAefrjLyQX6LTGZAwy4FKByVMBhyFWK3Fj7NCVQnPofuZBOJRZA1i56nrsCIsat2pAPNV7zVZCoCT3HFCLRzksKOLi3ZCz7KwZBUbktSgyhAK7ClEQyfY2FJP9iRLh6az0Xx3snZCXbBH3yboR1jOMZCRcujhMx2jKvN"
      WHATSAPP_PHONE_NUMBER_ID: "1193756023831033"
      WHATSAPP_API_VERSION: "v25.0"
      WHATSAPP_TEMPLATE_NAME: "jaspers_market_order_confirmation_v1"
      WHATSAPP_TEMPLATE_LANG: "en_US"
      MOCK_WHATSAPP: "false"
