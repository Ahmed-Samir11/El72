services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elhaq}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${TIMESCALE_DB:-elhaq_ts}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./secrets/db-tls/timescaledb-server.crt:/var/lib/postgresql/server.crt:ro
      - ./secrets/db-tls/timescaledb-server.key:/var/lib/postgresql/server.key:ro

  postgres:
    image: postgres:15
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elhaq}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-elhaq}
    ports:
      # Host 5432 is often occupied by a local Postgres; use 5434 externally.
      - "127.0.0.1:5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./secrets/db-tls/postgres-server.crt:/var/lib/postgresql/server.crt:ro
      - ./secrets/db-tls/postgres-server.key:/var/lib/postgresql/server.key:ro

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    depends_on:
      - redis
      - timescaledb
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}"
      TIMESCALE_URL: "${TIMESCALE_URL_DOCKER:?Set TIMESCALE_URL_DOCKER in .env}"
      DEMO_MODE: "${DEMO_MODE:-false}"
    ports:
      - "8001:8000"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - redis
      - postgres
      - timescaledb
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}"
      TIMESCALE_URL: "${TIMESCALE_URL_DOCKER:?Set TIMESCALE_URL_DOCKER in .env}"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  notifier:
    build:
      context: ./services/notification
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
      MOCK_WHATSAPP: "true"
      METRICS_PORT: "8000"
    command: ["npm", "run", "start"]

  scraper-monitor:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile.monitor
    depends_on:
      - redis
      - postgres
      - timescaledb
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}"
      TIMESCALE_URL: "${TIMESCALE_URL_DOCKER:?Set TIMESCALE_URL_DOCKER in .env}"
      REDIS_URL: "redis://redis:6379"
      SCRAPE_INTERVAL: "30"
      MAX_CONCURRENT_SCRAPES: "10"
      BROWSER_POOL_SIZE: "5"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "stream:targets"
      METRICS_PORT: "8000"
  
  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}"
      REDIS_URL: "redis://redis:6379"
      SCRAPER_TARGETS_SOURCE: "redis_stream"
      SCRAPER_TARGETS_STREAM: "stream:targets"
      STREAM_CONFIRMED_DEALS: "stream:confirmed_deals"
      BROWSER_POOL_SIZE: "2"
      SCRAPER_NAV_TIMEOUT_MS: "60000"
      METRICS_PORT: "8000"
    command: ["python", "-m", "services.scraper.scraper"]
  
  whatsapp:
    build:
      context: ./services/whatsapp
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}"
      STREAM_NAME: "stream:confirmed_deals"
      CONSUMER_GROUP: "cg_whatsapp"
      CONSUMER_NAME: "whatsapp-1"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v25.0}"
      WHATSAPP_TEMPLATE_NAME: "${WHATSAPP_TEMPLATE_NAME:-el72_price_alert}"
      WHATSAPP_TEMPLATE_LANG: "${WHATSAPP_TEMPLATE_LANG:-en}"
      MOCK_WHATSAPP: "${MOCK_WHATSAPP:-true}"
    restart: unless-stopped


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_URI: "postgres:5432/elhaq?sslmode=verify-full&sslrootcert=/etc/ssl/certs/el72-db-ca.crt"
      DATA_SOURCE_USER: "el72_monitor"
      DATA_SOURCE_PASS: "${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD}"
    volumes:
      - ./secrets/db-tls/db-ca.crt:/etc/ssl/certs/el72-db-ca.crt:ro
    networks:
      - default

  timescaledb-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      DATA_SOURCE_URI: "timescaledb:5432/elhaq_ts?sslmode=verify-full&sslrootcert=/etc/ssl/certs/el72-db-ca.crt"
      DATA_SOURCE_USER: "el72_monitor"
      DATA_SOURCE_PASS: "${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD}"
    volumes:
      - ./secrets/db-tls/db-ca.crt:/etc/ssl/certs/el72-db-ca.crt:ro
    networks:
      - default

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks:
      - default


volumes:
  redis-data:
  pg-data:
  timescale-data:
  prometheus-data:
  grafana-data:
