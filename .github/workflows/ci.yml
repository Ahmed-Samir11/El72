name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Analyzer deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt || true
      - name: Run Analyzer tests (if present)
        run: |
          if [ -d "services/analyzer/tests" ]; then
            pytest services/analyzer/tests || true
          else
            echo "No analyzer tests"
          fi

  node-notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install notifier deps
        run: |
          cd services/notification
          npm ci || npm install
      - name: Build notifier
        run: |
          npm run build --prefix services/notification || true

  lint-and-tests:
    name: Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest || true

      - name: Run ruff (Python linter)
        run: |
          if [ -d "services" ]; then
            ruff check services || exit 1
          else
            echo "No Python services to lint"
          fi

      - name: Run black check (format)
        run: |
          if [ -d "services" ]; then
            black --check services || exit 1
          else
            echo "No Python services to format-check"
          fi

      - name: Run pytest if tests exist
        run: |
          if ls services/*/tests 1> /dev/null 2>&1; then
            pytest -q || exit 1
          else
            echo "No tests found"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps and run TypeScript build check
        run: |
          if [ -f services/notification/package.json ]; then
            cd services/notification
            npm ci || npm install
            npm run build || echo "No build script or build failed"
          else
            echo "No notifier package.json"
          fi

  # MS4: Flutter quality gate + signed App Bundle on PRs to main and v* tags.
  flutter-ci:
    name: Flutter - analyze, test, signed bundle
    runs-on: ubuntu-latest
    permissions:
      # contents:write is required by softprops/action-gh-release for v* tag
      # releases; everything else stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact Flutter version verified by this repo's tests.
      # Bump deliberately (see docs/release-checklist.md).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          cache: true

      - name: Verify Android platform 35 is available
        run: |
          if ! ls "$ANDROID_HOME/platforms"/android-35 >/dev/null 2>&1; then
            echo "Android platform 35 missing from the runner image." >&2
            exit 1
          fi

      - name: Flutter setup
        run: |
          cd flutter-app
          flutter --version
          flutter pub get

      - name: Analyze (fail on any issue)
        run: cd flutter-app && flutter analyze

      - name: Format check
        run: cd flutter-app && dart format --set-exit-if-changed .

      - name: Test
        run: cd flutter-app && flutter test

      # --- Signed App Bundle: PRs to main + v* tags only ---
      - name: Prepare release signing
        id: signing
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          # Fail fast if any signing secret is missing: a debug-signed AAB
          # must never be uploaded or published as a release artifact.
          for v in KEY_STORE KEYSTORE_PASSWORD KEY_ALIAS KEY_ALIAS_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Signing secret $v is not set - skipping signed build."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEY_STORE" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          # Values come from the step environment (not argv); file is deleted
          # with the runner.
          {
            echo "storeFile=$RUNNER_TEMP/keystore/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_ALIAS_PASSWORD"
          } > flutter-app/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed App Bundle
        if: steps.signing.outputs.signed == 'true'
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          cd flutter-app
          # versionCode policy (MS4):
          # - v* tag releases: owner-controlled RELEASE_VERSION_CODE secret,
          #   strictly increasing across releases (Play requirement).
          # - PR builds: commit count, informational only - PR artifacts are
          #   never submitted to Play.
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            if [ -z "$RELEASE_VERSION_CODE" ]; then
              echo "v* tag releases require the RELEASE_VERSION_CODE secret." >&2
              exit 1
            fi
            case "$RELEASE_VERSION_CODE" in
              ''|*[!0-9]*) echo "RELEASE_VERSION_CODE must be a positive integer." >&2; exit 1 ;;
            esac
            if [ "$RELEASE_VERSION_CODE" -lt 1 ]; then
              echo "RELEASE_VERSION_CODE must be >= 1." >&2
              exit 1
            fi
            export VERSION_CODE="$RELEASE_VERSION_CODE"
          else
            export VERSION_CODE=$(git rev-list --count HEAD)
          fi
          echo "Building release AAB (versionCode=$VERSION_CODE)"
          flutter build appbundle --release             --dart-define=API_BASE_URL="$PROD_API_BASE_URL"

      - name: Verify the AAB is release-signed
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner verify --print-certs             flutter-app/build/app/outputs/flutter-release/app-release.aab

      - name: Upload App Bundle artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elhaq-appbundle-${{ github.sha }}
          path: flutter-app/build/app/outputs/flutter-release/app-release.aab

      - name: Publish GitHub Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-app/build/app/outputs/flutter-release/app-release.aab
