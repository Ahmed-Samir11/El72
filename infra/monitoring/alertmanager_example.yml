global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 2h
  receiver: 'team-email'
  routes:
    - match:
        severity: critical
      receiver: 'pager'
    - match:
        severity: warning
      receiver: 'ops'

receivers:
  - name: 'pager'
    webhook_configs:
      - url: 'https://hooks.example.com/pagerduty'
  - name: 'ops'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#ops-alerts'
  - name: 'team-email'
    email_configs:
      - to: 'oncall@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

# Note: Replace webhook and email placeholders with your real endpoints and secrets.