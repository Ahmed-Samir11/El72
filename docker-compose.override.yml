services:
  api:
    environment:
      SECRET_KEY: "${SECRET_KEY:-}"

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "${DATABASE_URL:-postgresql://elhaq:elhaq_pass@postgres:5432/elhaq}"
      PAYMOB_HMAC_SECRET: "${PAYMOB_HMAC_SECRET:-}"
    ports:
      - "8002:8000"