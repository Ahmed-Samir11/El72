<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <text x="400" y="40" text-anchor="middle" fill="#f7941d" font-size="16" letter-spacing="4">EL72 INTELLIGENCE</text>
  <text x="400" y="64" text-anchor="middle" fill="#a1a1a6" font-size="13">the same pipeline, wrapped in the layer that decides what is real</text>

  <!-- intelligence band -->
  <rect x="40" y="86" width="720" height="150" rx="18" fill="rgba(247,148,29,0.06)" stroke="#f7941d" stroke-width="2"/>

  <!-- 4 intelligence nodes -->
  <g>
    <g stroke="rgba(247,148,29,0.5)" fill="rgba(247,148,29,0.10)">
      <rect x="55"  y="112" width="155" height="98" rx="10"/>
      <rect x="235" y="112" width="155" height="98" rx="10"/>
      <rect x="415" y="112" width="155" height="98" rx="10"/>
      <rect x="595" y="112" width="155" height="98" rx="10"/>
    </g>
    <g text-anchor="middle" fill="#f5f5f7" font-size="17" font-weight="700">
      <text x="132" y="150">Detect</text>
      <text x="312" y="150">Grade</text>
      <text x="492" y="150">Flag</text>
      <text x="672" y="150">Rank</text>
    </g>
    <g text-anchor="middle" fill="#a1a1a6" font-size="13">
      <text x="132" y="176">MAD + Isolation</text>
      <text x="132" y="192">Forest</text>
      <text x="312" y="176">Deal Score</text>
      <text x="312" y="192">0&ndash;100</text>
      <text x="492" y="176">Fake-Discount</text>
      <text x="492" y="192">penalty</text>
      <text x="672" y="176">Cross-Store</text>
      <text x="672" y="192">comparison</text>
    </g>
  </g>

  <!-- arrows up into the band -->
  <g stroke="#f7941d" stroke-width="2" fill="none" opacity="0.7">
    <line x1="135" y1="300" x2="135" y2="236"/>
    <line x1="345" y1="300" x2="345" y2="236"/>
    <line x1="555" y1="300" x2="555" y2="236"/>
    <line x1="725" y1="300" x2="725" y2="236"/>
    <path d="M135 236 l-5 8 h10 z" fill="#f7941d" stroke="none"/>
    <path d="M345 236 l-5 8 h10 z" fill="#f7941d" stroke="none"/>
    <path d="M555 236 l-5 8 h10 z" fill="#f7941d" stroke="none"/>
    <path d="M725 236 l-5 8 h10 z" fill="#f7941d" stroke="none"/>
  </g>

  <!-- dimmed pipeline boxes -->
  <g stroke="#46464b" fill="rgba(255,255,255,0.03)">
    <rect x="60"  y="300" width="150" height="60" rx="10"/>
    <rect x="270" y="300" width="150" height="60" rx="10"/>
    <rect x="480" y="300" width="150" height="60" rx="10"/>
    <rect x="690" y="300" width="70"  height="60" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#6e6e73" font-size="15">
    <text x="135" y="336">Scraper</text>
    <text x="345" y="336">Redis</text>
    <text x="555" y="336">TimescaleDB</text>
    <text x="725" y="336">Notify</text>
  </g>

  <text x="400" y="384" text-anchor="middle" fill="#a1a1a6" font-size="14">Swap the scraper; keep the intelligence. That is the defensible part.</text>
</svg>
